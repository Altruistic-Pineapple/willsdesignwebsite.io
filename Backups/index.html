    <script>
        // Fetch and load the navbar.html content into the navbar-placeholder div
        fetch('navs.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load navbar');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            })
            .catch(error => {
                console.error(error);
                // Optionally, you can display a message or fallback content in case of error
                document.getElementById('navbar-placeholder').innerHTML = '<p>Navbar failed to load</p>';
            });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const navbar = document.querySelector(".navbar");

            window.addEventListener("scroll", function () {
                if (window.scrollY > 50) {
                    navbar.classList.add("navbar-scroll");
                } else {
                    navbar.classList.remove("navbar-scroll");
                }
            });
        });
    </script>
